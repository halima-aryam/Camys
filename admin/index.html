<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camy's Merch — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body, #nc-root {
      background: #0d0a0f !important;
      font-family: 'Syne', sans-serif !important;
      color: #f5e6ef !important;
    }
    header, [class*="AppHeader"], [class*="app-header"] {
      background: #140f18 !important;
      border-bottom: 1px solid rgba(244,114,182,0.15) !important;
    }
    [class*="sidebar"], aside, nav[class*="Nav"] {
      background: #140f18 !important;
      border-right: 1px solid rgba(244,114,182,0.12) !important;
    }
    button[class*="primary"], [class*="Button--primary"] {
      background: #f472b6 !important;
      color: #0d0a0f !important;
      border: none !important;
      font-family: 'Syne', sans-serif !important;
      font-weight: 600 !important;
      letter-spacing: 1.5px !important;
    }
    button[class*="primary"]:hover {
      background: #ff8fa3 !important;
    }
    a[class*="active"], [class*="active"] a {
      color: #f472b6 !important;
      border-color: #f472b6 !important;
    }
    [class*="card"], [class*="Card"], [class*="ListItem"] {
      background: #140f18 !important;
      border: 1px solid rgba(244,114,182,0.15) !important;
      border-radius: 2px !important;
    }
    input, textarea, select, [class*="input"] {
      background: #1c1326 !important;
      border: 1px solid rgba(244,114,182,0.2) !important;
      border-radius: 2px !important;
      color: #f5e6ef !important;
      font-family: 'Syne', sans-serif !important;
    }
    input:focus, textarea:focus {
      border-color: #f472b6 !important;
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(244,114,182,0.15) !important;
    }
    [class*="brand"], [class*="Brand"] {
      font-family: 'Cinzel Decorative', serif !important;
      letter-spacing: 2px !important;
      color: #f472b6 !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
